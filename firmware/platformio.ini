; linorobot2 base firmware for ST Nucleo-H753ZI (STM32H753ZI)
;   2x CubeMars AK10-9 (MIT mode over FDCAN1) + optional MPU6050 IMU + micro-ROS.
;
; This is the firmware that makes the Nucleo a micro-ROS node on the linorobot2
; network. The micro-ROS agent is launched on the robot computer by
;   ros2 launch linorobot2_bringup bringup.launch.py
;
; Build & flash (directly to the STM32 over the onboard ST-LINK, no button):
;   pio run -e nucleo_h753zi -t upload

[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
framework = arduino
; Onboard ST-LINK V3E via OpenOCD (bundled with PlatformIO). Flashing works
; while the app runs; no bootloader button needed.
upload_protocol = stlink
debug_tool = stlink
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
; micro-ROS settings: distro MUST match the ROS 2 distro on the robot computer.
board_microros_distro = jazzy
board_microros_transport = serial
build_flags =
    ; STM32duino ships the HAL FDCAN module disabled by default; the in-house
    ; CAN driver (include/fdcan_h7.h) needs it. No Arduino CAN library is
    ; used: the popular ones (pazi88/STM32_CAN etc.) only support the older
    ; bxCAN peripheral, which the H7 does not have.
    -DHAL_FDCAN_MODULE_ENABLED
    ; micro-ROS runs over the ST-LINK Virtual COM Port (USART3 PD8/PD9), which
    ; is a REAL 921600-baud UART (unlike Teensy USB CDC where baud was nominal).
    ; HardwareSerial buffers default to 64 B; the 50 Hz publish burst is ~1.1 KB,
    ; so enlarge TX so Serial.write doesn't block the 20 ms control period.
    -DSERIAL_TX_BUFFER_SIZE=2048
    -DSERIAL_RX_BUFFER_SIZE=512
    ; arm-gcc >= 15 makes implicit-function-declaration a hard error, which
    ; breaks micro-ROS's rcutils (time_unix.c / clock_gettime). Harmless on
    ; older toolchains, so keep it. Forwarded into the micro-ROS CMake build.
    -Wno-error=implicit-function-declaration
; NOTE: after changing any build_flags, run
;   pio run -e nucleo_h753zi -t clean_microros
; before rebuilding, or the micro-ROS CMake cache keeps the old flags.
